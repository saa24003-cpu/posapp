<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS App - レジアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- 1. 未ログイン画面 -->
  <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md text-center space-y-6">
      <h1 class="text-2xl font-bold text-gray-900">POS レジアプリ</h1>
      <p class="text-sm text-gray-600">ご利用には Google アカウントでのログインが必要です。</p>
      <button id="login-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded-lg shadow-sm hover:bg-gray-50 font-medium transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google アカウントでログイン
      </button>
    </div>
  </div>

  <!-- 2. ログイン後画面 -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col">
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
      <h1 class="text-xl font-bold">POS App</h1>
      <div class="flex items-center gap-3">
        <span id="user-display-name" class="text-sm font-medium hidden sm:inline"></span>
        <button id="logout-btn" class="bg-indigo-700 hover:bg-indigo-800 text-xs sm:text-sm px-3 py-1.5 rounded transition">
          ログアウト
        </button>
      </div>
    </header>

    <main class="flex-1 p-4 max-w-5xl mx-auto w-full space-y-6">
      <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm"></div>

      <section class="bg-white p-5 rounded-xl shadow-sm space-y-4">
        <h2 class="text-lg font-bold border-b pb-2 text-gray-700">商品登録</h2>
        <form id="pos-form" class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <div>
            <label class="block text-xs text-gray-500 mb-1">日付</label>
            <input type="date" id="input-date" class="w-full border rounded p-2 text-sm" required>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">商品名</label>
            <input type="text" id="input-name" placeholder="例: リンゴ" class="w-full border rounded p-2 text-sm" required>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">単価 (円)</label>
            <input type="number" id="input-price" min="0" placeholder="150" class="w-full border rounded p-2 text-sm" required>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">個数</label>
            <input type="number" id="input-quantity" min="1" placeholder="2" class="w-full border rounded p-2 text-sm" required>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">カテゴリ</label>
            <input type="text" id="input-category" placeholder="例: 食品" class="w-full border rounded p-2 text-sm" required>
          </div>
          
          <div class="md:col-span-5 flex flex-col sm:flex-row justify-between items-center bg-gray-50 p-3 rounded mt-2 gap-3">
            <div class="text-gray-700 font-semibold">
              小計: <span id="auto-total" class="text-xl text-indigo-600 font-bold">0</span> 円
            </div>
            <button type="submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-8 rounded shadow transition">
              登録
            </button>
          </div>
        </form>
      </section>

      <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl shadow-sm space-y-2 flex flex-col justify-center">
          <h3 class="text-xs font-semibold text-gray-400 uppercase">総合計売上</h3>
          <p id="total-sales" class="text-3xl font-extrabold text-indigo-600">0 円</p>
          <div id="daily-summary" class="text-xs text-gray-500 space-y-1 max-h-32 overflow-y-auto pt-2 border-t"></div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow-sm md:col-span-2">
          <h3 class="text-sm font-bold text-gray-600 mb-2">日別売上推移</h3>
          <div class="h-40">
            <canvas id="sales-chart"></canvas>
          </div>
        </div>
      </section>

      <section class="bg-white p-5 rounded-xl shadow-sm space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3">
          <h2 class="text-lg font-bold text-gray-700">登録履歴 (自分の記録)</h2>
          <input type="text" id="search-input" placeholder="商品名で絞り込み..." class="border rounded px-3 py-1.5 text-sm w-full sm:w-64">
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-600">
              <tr>
                <th class="p-3">日付</th>
                <th class="p-3">商品名</th>
                <th class="p-3">カテゴリ</th>
                <th class="p-3 text-right">単価</th>
                <th class="p-3 text-right">個数</th>
                <th class="p-3 text-right">合計</th>
                <th class="p-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="records-list" class="divide-y"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCAtfJp9Yj65bpmx3Qppv8__TRoStT1kpE",
      authDomain: "posapp-d3f89.firebaseapp.com",
      projectId: "posapp-d3f89",
      storageBucket: "posapp-d3f89.firebasestorage.app",
      messagingSenderId: "159737280029",
      appId: "1:159737280029:web:d4ccdc7cb4dd669a5fb8f4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userDisplayName = document.getElementById('user-display-name');
    const errorMessage = document.getElementById('error-message');

    const posForm = document.getElementById('pos-form');
    const inputDate = document.getElementById('input-date');
    const inputName = document.getElementById('input-name');
    const inputPrice = document.getElementById('input-price');
    const inputQuantity = document.getElementById('input-quantity');
    const inputCategory = document.getElementById('input-category');
    const autoTotal = document.getElementById('auto-total');

    const recordsList = document.getElementById('records-list');
    const totalSalesEl = document.getElementById('total-sales');
    const dailySummaryEl = document.getElementById('daily-summary');
    const searchInput = document.getElementById('search-input');

    let currentUser = null;
    let recordsData = [];
    let salesChart = null;

    inputDate.value = new Date().toISOString().split('T')[0];

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        showError("ログインに失敗しました: " + err.message);
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userDisplayName.textContent = user.displayName || user.email;
        loginScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadRecords();
      } else {
        currentUser = null;
        loginScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
      }
    });

    function updateAutoTotal() {
      const price = parseFloat(inputPrice.value) || 0;
      const qty = parseInt(inputQuantity.value) || 0;
      autoTotal.textContent = (price * qty).toLocaleString();
    }
    inputPrice.addEventListener('input', updateAutoTotal);
    inputQuantity.addEventListener('input', updateAutoTotal);

    posForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const date = inputDate.value;
      const name = inputName.value.trim();
      const price = parseFloat(inputPrice.value);
      const quantity = parseInt(inputQuantity.value);
      const category = inputCategory.value.trim();

      if (!date || !name || !category || isNaN(price) || isNaN(quantity)) {
        showError("全ての項目を正しく入力してください。");
        return;
      }
      if (price < 0 || quantity <= 0) {
        showError("単価は0以上、個数は1以上を入力してください。");
        return;
      }

      try {
        await addDoc(collection(db, "sales"), {
          uid: currentUser.uid,
          date,
          name,
          price,
          quantity,
          totalPrice: price * quantity,
          category,
          createdAt: serverTimestamp()
        });

        inputName.value = '';
        inputPrice.value = '';
        inputQuantity.value = '';
        inputCategory.value = '';
        autoTotal.textContent = '0';
      } catch (err) {
        showError("データの保存に失敗しました: " + err.message);
      }
    });

    function loadRecords() {
      if (!currentUser) return;

      const q = query(
        collection(db, "sales"),
        where("uid", "==", currentUser.uid),
        orderBy("createdAt", "desc")
      );

      onSnapshot(q, (snapshot) => {
        recordsData = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderRecords();
      }, (err) => {
        showError("データ取得エラー: " + err.message);
      });
    }

    function renderRecords() {
      const filterText = searchInput.value.toLowerCase().trim();
      recordsList.innerHTML = '';

      let totalSales = 0;
      const dailyTotals = {};

      const filteredRecords = recordsData.filter(item => {
        return item.name.toLowerCase().includes(filterText);
      });

      filteredRecords.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 border-b";
        tr.innerHTML = `
          <td class="p-3 text-xs sm:text-sm">${item.date}</td>
          <td class="p-3 font-medium text-xs sm:text-sm">${escapeHtml(item.name)}</td>
          <td class="p-3 text-xs sm:text-sm"><span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs">${escapeHtml(item.category)}</span></td>
          <td class="p-3 text-right text-xs sm:text-sm">${item.price.toLocaleString()}円</td>
          <td class="p-3 text-right text-xs sm:text-sm">${item.quantity}</td>
          <td class="p-3 text-right font-bold text-xs sm:text-sm">${item.totalPrice.toLocaleString()}円</td>
          <td class="p-3 text-center">
            <button data-id="${item.id}" class="delete-btn text-red-500 hover:text-red-700 text-xs font-semibold px-2 py-1 rounded hover:bg-red-50">
              削除
            </button>
          </td>
        `;
        recordsList.appendChild(tr);
      });

      recordsData.forEach(item => {
        totalSales += item.totalPrice;
        dailyTotals[item.date] = (dailyTotals[item.date] || 0) + item.totalPrice;
      });

      totalSalesEl.textContent = `${totalSales.toLocaleString()} 円`;

      dailySummaryEl.innerHTML = '';
      const sortedDates = Object.keys(dailyTotals).sort().reverse();
      sortedDates.forEach(date => {
        const div = document.createElement('div');
        div.className = "flex justify-between";
        div.innerHTML = `<span>${date}</span> <span class="font-bold">${dailyTotals[date].toLocaleString()}円</span>`;
        dailySummaryEl.appendChild(div);
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const docId = e.target.getAttribute('data-id');
          if (confirm("この記録を削除しますか？")) {
            try {
              await deleteDoc(doc(db, "sales", docId));
            } catch (err) {
              showError("削除に失敗しました: " + err.message);
            }
          }
        });
      });

      updateChart(dailyTotals);
    }

    searchInput.addEventListener('input', renderRecords);

    function updateChart(dailyTotals) {
      const dates = Object.keys(dailyTotals).sort();
      const totals = dates.map(d => dailyTotals[d]);
      const ctx = document.getElementById('sales-chart').getContext('2d');

      if (salesChart) {
        salesChart.destroy();
      }

      salesChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [{
            label: '売上 (円)',
            data: totals,
            borderColor: '#4F46E5',
            backgroundColor: 'rgba(79, 70, 229, 0.1)',
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.remove('hidden');
    }
    function hideError() {
      errorMessage.classList.add('hidden');
    }
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }
  </script>
</body>
</html>
